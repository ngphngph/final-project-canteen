worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen      80;
        server_name _;

        location / {
            root  /usr/share/nginx/html;
            index index.html admin.html kitchen.html;
            try_files $uri $uri/ =404;
        }

        # WebSocket — 取餐叫號大螢幕
        location /ws/ {
            proxy_pass         http://restaurant-app:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
        }

        # 圖片上傳（由 Spring Boot 靜態資源處理）
        location /uploads/ {
            proxy_pass http://restaurant-app:8080/uploads/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 1. 登入服務  → /api/users/...
        location /api/login/ {
            proxy_pass http://restaurant-app:8080/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. 菜單服務  → /api/dishes/... /api/drinks/... /api/menus/...
        location /api/menu/ {
            proxy_pass http://restaurant-app:8080/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. 訂單服務  → /orders/...
        location /api/order/ {
            proxy_pass http://restaurant-app:8080/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. 錢包服務  → /wallets/...
        location /api/wallet/ {
            proxy_pass http://restaurant-app:8080/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 5. 取餐服務  → /api/pickups/...
        location /api/pickup/ {
            proxy_pass http://restaurant-app:8080/;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
