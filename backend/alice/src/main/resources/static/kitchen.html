<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen Dashboard - Canteen</title>
  <link rel="stylesheet" href="/canteen-present.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { green: "#16a34a", orange: "#f97316" } }
        }
      }
    }
  </script>
</head>
<body class="present-ui present-kitchen">
  <div class="min-h-screen flex">
    <aside class="kitchen-sidebar w-56 shrink-0 hidden md:flex flex-col p-4">
      <div class="flex items-center gap-2 mb-6 pb-4 border-b border-slate-600">
        <span class="text-2xl">👨‍🍳</span>
        <div>
          <p class="font-bold text-emerald-400 text-sm">KITCHEN_USER</p>
          <p class="text-xs text-slate-400">廚房後台</p>
        </div>
      </div>
      <nav class="space-y-1 text-sm flex-1">
        <a href="#" class="active">總覽</a>
        <a href="#">訂單管理</a>
        <a href="#">備貨確認</a>
        <a href="#">菜單管理</a>
        <a href="#">銷售報告</a>
      </nav>
      <div class="pt-4 border-t border-slate-600 text-sm space-y-2">
        <a href="#" class="text-slate-400">設定</a>
        <a href="#" class="text-slate-400">登出</a>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
      <header class="px-5 py-4 border-b border-slate-700 flex flex-wrap justify-between items-center gap-3">
        <div>
          <h1 class="font-bold text-xl text-white">Kitchen 後台</h1>
          <p class="text-xs text-slate-400">今日訂單 / 備貨 / 銷售報告</p>
        </div>
        <div class="text-sm text-right">
          <p class="text-emerald-400">系統狀態：正常 ●</p>
          <p id="kitchenClock" class="text-slate-400 text-xs mt-1"></p>
        </div>
      </header>

      <main class="flex-1 p-5 space-y-5 max-w-7xl w-full mx-auto">
        <section class="grid lg:grid-cols-3 gap-4">
          <div class="kitchen-card lg:col-span-2">
            <div class="p-4 border-b border-slate-600 flex justify-between items-center">
              <h2 class="font-semibold">今日訂單列表</h2>
              <button type="button" id="refreshOrdersBtn" class="present-btn-primary text-xs px-3 py-1.5">重新整理</button>
            </div>
            <div id="orderList" class="divide-y divide-slate-600"></div>
            <p class="p-3 text-xs text-slate-500 text-right">查看全部訂單 ›</p>
          </div>

          <div class="kitchen-card">
            <div class="p-4 border-b border-slate-600">
              <h2 class="font-semibold">備貨量確認</h2>
            </div>
            <div id="stockList" class="p-4 space-y-2 text-sm"></div>
          </div>
        </section>

        <section class="kitchen-card p-4">
          <h2 class="font-semibold mb-4">今日銷售報告</h2>
          <div id="salesReport" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3"></div>
        </section>

        <section class="kitchen-card overflow-hidden">
          <div class="p-4 border-b border-slate-600 flex flex-wrap justify-between items-center gap-3">
            <h2 class="font-semibold text-lg">Dish 菜單管理</h2>
            <button type="button" onclick="saveAllData()" class="present-btn-primary px-4 py-2 text-sm">💾 儲存全部資料</button>
          </div>
          <div class="overflow-x-auto">
            <table class="present-table w-full text-sm">
              <thead>
                <tr>
                  <th class="text-left px-4 py-3">Dish</th>
                  <th class="text-left px-4 py-3">庫存</th>
                  <th class="text-left px-4 py-3">狀態</th>
                  <th class="text-left px-4 py-3">Special Request</th>
                  <th class="text-left px-4 py-3">刪除</th>
                </tr>
              </thead>
              <tbody id="dishTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/canteen-store.js"></script>
  <script>
    const state = loadCanteenState();
    rehydrateMenuImagesFromStore(state);

    function dishStatusBadge(status) {
      if (status === "SOLD_OUT") return '<span class="present-badge-sold">售罄</span>';
      return '<span class="present-badge-supply">供應中</span>';
    }

    function updateKitchenClock() {
      const el = document.getElementById("kitchenClock");
      if (el) el.textContent = new Date().toLocaleString("zh-HK", { hour12: false });
    }
    updateKitchenClock();
    setInterval(updateKitchenClock, 60000);

    function parseOptions(value) {
      return value.split(",").map(s => s.trim()).filter(Boolean);
    }

    function renderKitchenDishTable() {
      const dishBody = document.getElementById("dishTableBody");
      if (!dishBody) return;
      dishBody.innerHTML = state.dishes.map(d => `
        <tr class="border-t">
          <td class="px-4 py-3"><input id="dish-name-${d.id}" class="border rounded px-2 py-1 w-40" value="${d.name}" /></td>
          <td class="px-4 py-3"><input id="dish-balance-${d.id}" class="border rounded px-2 py-1 w-20" type="number" value="${d.balance}" /></td>
          <td class="px-4 py-3">${dishStatusBadge(d.status)}</td>
          <td class="px-4 py-3"><input id="dish-options-${d.id}" class="border rounded px-2 py-1 w-56" value="${(d.options || []).join(", ")}" /></td>
          <td class="px-4 py-3">
            <button type="button" onclick="deleteDish(${d.id})"
              class="text-red-400 hover:text-red-300 text-sm">🗑</button>
          </td>
        </tr>
      `).join("");
    }

    function collectDishFormIntoState() {
      state.dishes.forEach(d => {
        const nameEl = document.getElementById(`dish-name-${d.id}`);
        if (!nameEl) return;
        d.name = nameEl.value.trim();
        d.balance = Number(document.getElementById(`dish-balance-${d.id}`).value);
        d.options = parseOptions(document.getElementById(`dish-options-${d.id}`).value);
      });
      refreshDishStatuses(state);
    }

    function saveAllData() {
      collectDishFormIntoState();
      try {
        saveCanteenStateAndSync(state);
        renderKitchenDishTable();
        refreshKitchenDashboard();
        alert("已完成儲存：已同步 Teacher / Student 前台菜單。");
      } catch (e) {
        alert(e.message || "儲存失敗");
      }
    }

    function deleteDish(id) {
      const dish = state.dishes.find(d => d.id === id);
      if (!dish) return;
      if (!confirm(`確定要刪除 Dish「${dish.name}」嗎？此操作會同步更新 Teacher / Student 前台。`)) {
        return;
      }
      collectDishFormIntoState();
      deleteDishFromState(state, id);
      saveCanteenStateAndSync(state);
      renderKitchenDishTable();
      refreshKitchenDashboard();
      alert(`已刪除 Dish #${id}，並同步前台。`);
    }

    function orderStatusBadge(status) {
      if (status === "COMPLETED") {
        return '<span class="present-badge-supply">已完成</span>';
      }
      return '<span class="present-badge-sold">待處理</span>';
    }

    function renderStockList() {
      const state = loadCanteenState();
      const el = document.getElementById("stockList");
      if (!state.dishes.length) {
        el.innerHTML = '<p class="text-sm text-slate-500">暫無菜品資料</p>';
        return;
      }
      el.innerHTML = state.dishes
        .map(d => {
          const balance = Number(d.balance) || 0;
          const soldOut = balance <= 0 || d.status === "SOLD_OUT";
          return `
            <div class="flex justify-between text-sm border-b border-slate-600/50 pb-2 ${soldOut ? "text-red-400" : "text-slate-300"}">
              <span>${d.name}</span>
              <span>尚餘 ${balance} 份</span>
            </div>
          `;
        })
        .join("");
    }

    function renderSalesReport() {
      const orders = getTodayOrders();
      const report = buildTodaySalesReport(orders, loadCanteenState());
      const el = document.getElementById("salesReport");
      el.innerHTML = `
        <div class="stat-card"><p>總單數</p><p>${report.totalOrders}</p></div>
        <div class="stat-card"><p>已完成</p><p class="text-emerald-400">${report.completedOrders}</p></div>
        <div class="stat-card"><p>待處理</p><p class="text-orange-400">${report.pendingOrders}</p></div>
        <div class="stat-card"><p>今日營業額</p><p>$${report.revenue}</p></div>
        <div class="stat-card sm:col-span-2 lg:col-span-1"><p>最熱賣 Dish</p><p class="text-base">${report.topDish}</p></div>
      `;
    }

    function renderOrderList() {
      const orders = getTodayOrders();
      const el = document.getElementById("orderList");
      if (!orders.length) {
        el.innerHTML = '<p class="p-6 text-sm text-slate-500 text-center">今日尚無訂單</p>';
        return;
      }
      el.innerHTML = orders
        .map(o => {
          const done = o.status === "COMPLETED";
          const optionsLines = (o.items || [])
            .filter(i => i.specialRequestOptions && i.specialRequestOptions.length)
            .map(
              i =>
                `<p class="text-xs text-slate-500">${i.name}：${i.specialRequestOptions.join(", ")}</p>`
            )
            .join("");
          return `
            <div class="p-4 flex flex-wrap gap-3 justify-between items-start hover:bg-slate-800/50">
              <div class="space-y-1">
                <p class="font-medium text-white">Order #${o.id}</p>
                <p class="text-xs text-slate-400">${o.role === "teacher" ? "TEACHER" : "STUDENT"} · $${o.total}</p>
                <p class="text-sm text-slate-300">${formatOrderItemsSummary(o.items)}</p>
                ${optionsLines}
              </div>
              <div class="flex flex-wrap gap-2 items-center">
                ${orderStatusBadge(o.status)}
                ${
                  done
                    ? ""
                    : `<button type="button" data-order-id="${o.id}"
                        class="complete-order-btn present-btn-orange px-3 py-1.5 text-sm">
                        完成訂單
                      </button>`
                }
              </div>
            </div>
          `;
        })
        .join("");

      el.querySelectorAll(".complete-order-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const orderId = Number(btn.dataset.orderId);
          const order = completeOrder(orderId);
          refreshKitchenDashboard();
          if (order) {
            const who = order.role === "teacher" ? "Teacher" : "Student";
            alert(`訂單 #${orderId} 已完成，狀態已通知 ${who} 點餐頁。`);
          }
        });
      });
    }

    function refreshKitchenDashboard() {
      renderOrderList();
      renderStockList();
      renderSalesReport();
      renderKitchenDishTable();
    }

    document.getElementById("refreshOrdersBtn").addEventListener("click", refreshKitchenDashboard);
    window.addEventListener("canteen-store-updated", refreshKitchenDashboard);
    window.addEventListener("storage", e => {
      if (e.key === CANTEEN_ORDERS_KEY || e.key === CANTEEN_STORE_KEY) {
        refreshKitchenDashboard();
      }
    });

    refreshKitchenDashboard();
  </script>
</body>
</html>
