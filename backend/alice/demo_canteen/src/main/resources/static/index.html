<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canteen 午餐訂餐平台</title>
  <link rel="stylesheet" href="/canteen-present.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              green: "#16a34a",
              orange: "#f97316"
            }
          }
        }
      }
    };
  </script>
</head>
<body class="present-ui present-student text-slate-800 flex flex-col min-h-screen">
  <header class="student-header sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-brand-green text-white flex items-center justify-center text-lg">🍴</div>
        <div>
          <h1 class="font-bold text-lg text-slate-800">Canteen 午餐訂餐平台</h1>
          <p class="text-xs text-slate-500">STUDENT / TEACHER 點餐主頁</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-3 text-sm">
        <span class="period-badge px-3 py-1 rounded-full font-medium">訂購時段 11:00-14:30</span>
        <select id="roleSelect" class="border border-slate-200 rounded-lg px-2 py-1 text-slate-700 bg-white">
          <option value="student">學生</option>
          <option value="teacher">老師</option>
        </select>
        <span class="flex items-center gap-2 text-slate-600">
          <span class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-xs">用</span>
          <span id="userDisplayName">訪客</span>
        </span>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl mx-auto px-4 py-6 w-full lg:grid lg:grid-cols-12 lg:gap-6">
    <section class="lg:col-span-8 space-y-6">
      <div class="present-card p-4">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <h2 class="text-xl font-semibold text-slate-800">精選主食</h2>
          <div class="flex items-center gap-2 text-sm text-slate-500">
            <select class="border rounded-lg px-2 py-1 text-slate-600"><option>熱門推薦</option></select>
            <span class="text-slate-400">|</span>
            <span>▦ 格狀</span>
          </div>
        </div>
        <p class="text-xs text-slate-500 mb-3">Special Request（選項，可多選）</p>
        <div id="dishList" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
      </div>

      <div class="present-card p-4">
        <h2 class="text-xl font-semibold text-slate-800 mb-4">飲品選擇</h2>
        <div id="drinkList" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
      </div>
    </section>

    <aside class="lg:col-span-4 mt-6 lg:mt-0">
      <div class="present-sidebar-panel lg:sticky lg:top-24 p-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold text-lg">購物車</h3>
          <span id="cartCount" class="text-xs px-2 py-1 rounded-full bg-orange-100 text-orange-700">0 件</span>
        </div>
        <div id="cartItems" class="space-y-2 max-h-72 overflow-auto pr-1"></div>
        <div class="border-t border-slate-200 mt-4 pt-3 space-y-2">
          <div class="flex justify-between text-sm">
            <span>小計</span>
            <span id="subtotal" class="font-medium">$0</span>
          </div>
          <button id="previewBtn" type="button" class="w-full present-btn-primary py-2.5 text-sm">
            預覽訂單內容 →
          </button>
        </div>
        <div class="border-t border-slate-200 mt-4 pt-4">
          <h3 class="font-semibold text-lg mb-2">我的訂單</h3>
          <div id="orderStatusBanner" class="hidden mb-2 rounded-lg bg-green-50 border border-green-200 px-3 py-2 text-sm text-green-800"></div>
          <div id="myOrdersList" class="space-y-2 max-h-52 overflow-auto pr-1"></div>
          <button id="viewAllOrdersBtn" type="button"
            class="w-full mt-3 py-2 text-sm text-center text-brand-green hover:text-green-800 font-medium border border-green-200 rounded-lg hover:bg-green-50 transition-colors">
            查看全部訂單 ›
          </button>
        </div>
      </div>
    </aside>
  </main>

  <footer class="mt-auto px-4 py-4 text-center">
    <p>如有任何問題，請聯絡飯堂職員。</p>
    <p class="mt-1">© Canteen 午餐訂餐平台 版權所有 · <a href="#" class="text-brand-green hover:underline">私隱政策</a></p>
  </footer>

  <!-- 全部訂單 Modal -->
  <div id="allOrdersModal" class="hidden fixed inset-0 bg-black/40 z-50 items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl p-5 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center mb-4 shrink-0">
        <h4 class="text-xl font-semibold">我的全部訂單（今日）</h4>
        <button type="button" id="closeAllOrdersModal" class="text-slate-500 hover:text-slate-700 text-lg leading-none">×</button>
      </div>
      <div id="allOrdersContent" class="space-y-3 overflow-y-auto pr-1 flex-1"></div>
    </div>
  </div>

  <!-- 訂單預覽 Modal -->
  <div id="previewModal" class="hidden fixed inset-0 bg-black/40 z-50 items-center justify-center p-4">
    <div class="bg-white w-full max-w-2xl rounded-2xl p-5">
      <div class="flex justify-between items-center mb-4">
        <h4 class="text-xl font-semibold">訂單預覽</h4>
        <button id="closeModal" class="text-slate-500 hover:text-slate-700">關閉</button>
      </div>
      <div id="previewContent" class="space-y-2"></div>
      <div class="mt-4 border-t pt-3 flex justify-between font-semibold">
        <span>總計</span>
        <span id="previewTotal">$0</span>
      </div>
      <button id="submitOrderBtn" type="button"
        class="mt-4 w-full bg-brand-orange hover:bg-orange-600 text-white py-2 rounded-lg font-medium">
        確認送出訂單
      </button>
    </div>
  </div>

  <script src="/canteen-store.js"></script>
  <script>
    // 讀取 Teacher / Student 已發布菜單（Admin「儲存全部資料」後同步）
    let frontendRole = new URLSearchParams(window.location.search).get("role") === "teacher" ? "teacher" : "student";
    const roleSelect = document.getElementById("roleSelect");
    if (roleSelect) {
      roleSelect.value = frontendRole;
      roleSelect.addEventListener("change", () => {
        frontendRole = roleSelect.value;
        document.getElementById("userDisplayName").textContent = frontendRole === "teacher" ? "老師" : "學生";
        reloadPublishedMenu();
        renderMyOrders();
      });
    }
    document.getElementById("userDisplayName").textContent = frontendRole === "teacher" ? "老師" : "學生";

    let dishes = [];
    let drinks = [];

    function reloadPublishedMenu() {
      const published = loadFrontendMenu(frontendRole);
      dishes = published.dishes;
      drinks = published.drinks;
      renderDishes();
      renderDrinks();
    }

    const cart = [];
    const lastOrderStatusById = {};
    const MY_ORDERS_PREVIEW_LIMIT = 3;

    function formatOrderDate(iso) {
      if (!iso) return "";
      try {
        return new Date(iso).toLocaleString("zh-HK", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        });
      } catch (_) {
        return "";
      }
    }

    function countOrderItems(items) {
      return (items || []).length;
    }

    function myOrderStatusLabel(status) {
      if (status === "COMPLETED") {
        return '<span class="text-[10px] px-1.5 py-0.5 rounded bg-green-100 text-green-700">已完成</span>';
      }
      return '<span class="text-[10px] px-1.5 py-0.5 rounded bg-orange-100 text-orange-700">待處理</span>';
    }

    function showOrderCompletedBanner(order) {
      const banner = document.getElementById("orderStatusBanner");
      const msg = order.statusMessage || "廚房已完成您的訂單，請取餐。謝謝﹗";
      banner.textContent = `訂單 #${order.id}：${msg}`;
      banner.classList.remove("hidden");
    }

    function renderOrderCardHtml(o, detailed) {
      const dateStr = formatOrderDate(o.createdAt);
      const itemCount = countOrderItems(o.items);
      return `
        <div class="border border-slate-200 rounded-lg p-2.5 text-xs bg-slate-50/50">
          <div class="flex justify-between items-start gap-2 mb-1">
            <div>
              <span class="font-semibold text-slate-800">#${o.id}</span>
              ${dateStr ? `<span class="text-slate-400 ml-1">${dateStr}</span>` : ""}
            </div>
            ${myOrderStatusLabel(o.status)}
          </div>
          <p class="text-slate-600">${formatOrderItemsSummary(o.items)}</p>
          <p class="text-slate-500 mt-1">${itemCount} 項 · $${o.total}</p>
          ${
            o.status === "COMPLETED"
              ? `<p class="mt-1.5 text-green-700">${o.statusMessage || "廚房已完成您的訂單，請取餐。謝謝﹗"}</p>`
              : detailed
                ? '<p class="mt-1.5 text-orange-600">廚房處理中，請稍候…</p>'
                : ""
          }
        </div>
      `;
    }

    function getMyOrders() {
      return getTodayOrdersForRole(frontendRole);
    }

    function syncOrderCompletionNotifications(orders) {
      orders.forEach(o => {
        const prev = lastOrderStatusById[o.id];
        if (prev && prev !== "COMPLETED" && o.status === "COMPLETED") {
          showOrderCompletedBanner(o);
        }
        lastOrderStatusById[o.id] = o.status;
      });
    }

    function renderMyOrders() {
      const el = document.getElementById("myOrdersList");
      const btn = document.getElementById("viewAllOrdersBtn");
      const orders = getMyOrders();
      syncOrderCompletionNotifications(orders);

      if (!orders.length) {
        el.innerHTML = '<p class="text-xs text-slate-400">今日尚無訂單</p>';
        if (btn) btn.classList.add("hidden");
        return;
      }
      if (btn) btn.classList.remove("hidden");

      const preview = orders.slice(0, MY_ORDERS_PREVIEW_LIMIT);
      el.innerHTML = preview.map(o => renderOrderCardHtml(o, false)).join("");
    }

    function openAllOrdersModal() {
      const modal = document.getElementById("allOrdersModal");
      const content = document.getElementById("allOrdersContent");
      const orders = getMyOrders();
      if (!orders.length) {
        content.innerHTML = '<p class="text-sm text-slate-400 text-center py-6">今日尚無訂單</p>';
      } else {
        content.innerHTML = orders.map(o => renderOrderCardHtml(o, true)).join("");
      }
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeAllOrdersModal() {
      const modal = document.getElementById("allOrdersModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    document.getElementById("viewAllOrdersBtn").addEventListener("click", openAllOrdersModal);
    document.getElementById("closeAllOrdersModal").addEventListener("click", closeAllOrdersModal);
    document.getElementById("allOrdersModal").addEventListener("click", e => {
      if (e.target.id === "allOrdersModal") closeAllOrdersModal();
    });

    function statusBadge(status) {
      return status === "SOLD_OUT"
        ? '<span class="text-[10px] px-1 py-0.5 rounded bg-red-100 text-red-700">售完</span>'
        : '<span class="text-[10px] px-1 py-0.5 rounded bg-green-100 text-green-700">上架</span>';
    }

    // 渲染 Dish 卡片
    function renderDishes() {
      const el = document.getElementById("dishList");
      el.innerHTML = dishes.map(d => `
        <div class="present-menu-card text-center ${d.status === "SOLD_OUT" ? "opacity-70" : ""}">
          <img src="${resolveItemImage(d)}" alt="${d.name}" class="w-full aspect-square object-cover" />
          <div class="p-2 space-y-1.5">
            <h3 class="font-semibold text-sm leading-tight line-clamp-2 text-slate-800">${d.name}</h3>
            <div class="flex justify-center">${statusBadge(d.status)}</div>
            <p class="text-base text-slate-700 font-semibold">$${d.price} · 尚餘 ${d.balance}</p>
            ${(d.options || []).length
              ? `<div class="text-left">
                   <div class="mt-1 space-y-1 max-h-20 overflow-y-auto">
                     ${(d.options || []).map((o, idx) => `
                       <label class="flex items-center gap-1 text-[10px] bg-slate-50 border rounded px-1 py-0.5">
                         <input type="checkbox" class="shrink-0" data-dish-id="${d.id}" data-option="${o}" id="dish-${d.id}-opt-${idx}" />
                         <span class="truncate">${o}</span>
                       </label>
                     `).join("")}
                   </div>
                 </div>`
              : ""}
            <button type="button" ${d.status === "SOLD_OUT" ? "disabled" : ""} onclick="addToCart('dish', ${d.id})"
              class="add-btn w-full ${d.status === "SOLD_OUT" ? "!bg-slate-300 cursor-not-allowed" : ""}">
              ${d.status === "SOLD_OUT" ? "售完" : "+ 加入"}
            </button>
          </div>
        </div>
      `).join("");
    }

    // 渲染 Drink 卡片（Drink 沒有存貨限制）
    function renderDrinks() {
      const el = document.getElementById("drinkList");
      el.innerHTML = drinks.map(d => `
        <div class="present-menu-card text-center">
          <img src="${resolveItemImage(d)}" alt="${d.name}" class="w-full aspect-square object-cover" />
          <div class="p-2 space-y-1.5">
            <h3 class="font-semibold text-sm leading-tight line-clamp-2 text-slate-800">${d.name}</h3>
            <p class="text-base text-slate-700 font-semibold">$${d.price}</p>
            <div class="text-left space-y-1 max-h-20 overflow-y-auto">
              ${(d.options || []).map((o, idx) => `
                <label class="flex items-center gap-1 text-[10px] bg-slate-50 border rounded px-1 py-0.5">
                  <input type="checkbox" class="shrink-0" data-drink-id="${d.id}" data-option="${o}" id="drink-${d.id}-opt-${idx}" />
                  <span class="truncate">${o}</span>
                </label>
              `).join("")}
            </div>
            <button type="button" onclick="addToCart('drink', ${d.id})"
              class="add-btn w-full !bg-brand-orange hover:!bg-orange-600">
              + 加入
            </button>
          </div>
        </div>
      `).join("");
    }

    function countDishInCart(dishId) {
      return cart.filter(c => c.type === "dish" && c.id === dishId).length;
    }

    // 加入購物車
    function addToCart(type, id) {
      if (!assertOrderWindowOpen()) return;
      const source = type === "dish" ? dishes : drinks;
      const item = source.find(x => x.id === id);
      // Dish 仍受 SOLD_OUT / 庫存限制；Drink 不受限制
      if (!item || (type === "dish" && item.status === "SOLD_OUT")) return;
      if (type === "dish") {
        const inCart = countDishInCart(id);
        if (inCart >= Number(item.balance)) {
          alert(`「${item.name}」庫存不足（剩餘 ${item.balance} 份）。`);
          return;
        }
      }
      // 讀取該 Dish 的 special request 細項（Drink 無此欄）
      const selectedOptions = type === "dish"
        ? Array.from(document.querySelectorAll(`input[type="checkbox"][data-dish-id="${id}"]:checked`)).map(el => el.dataset.option)
        : Array.from(document.querySelectorAll(`input[type="checkbox"][data-drink-id="${id}"]:checked`)).map(el => el.dataset.option);

      cart.push({
        type,
        id: item.id,
        name: item.name,
        price: item.price,
        specialRequestOptions: selectedOptions
      });
      renderCart();
    }

    /** 依加入順序：前 N 杯飲品可配 Dish 免費（N = Dish 數量），其餘視為單點飲品。 */
    function getCartLinePricing() {
      let freeDrinkSlots = cart.filter(c => c.type === "dish").length;
      return cart.map(c => {
        if (c.type !== "drink") {
          return { payable: c.price, original: c.price, isDrinkFree: false, isSingleDrink: false };
        }
        const isFree = freeDrinkSlots > 0;
        if (isFree) freeDrinkSlots -= 1;
        return {
          payable: isFree ? 0 : c.price,
          original: c.price,
          isDrinkFree: isFree,
          isSingleDrink: !isFree
        };
      });
    }

    function formatLinePrice(line) {
      if (line.isDrinkFree) {
        return `<s class="text-slate-400">$${line.original}</s> <span class="text-green-700">$0</span>`;
      }
      if (line.isSingleDrink && line.original > 0) {
        return `<span>$${line.payable}</span> <span class="text-xs text-orange-600">單點</span>`;
      }
      return `$${line.payable}`;
    }

    function calculateTotals() {
      const dishItems = cart.filter(c => c.type === "dish");
      const drinkItems = cart.filter(c => c.type === "drink");
      const dishCount = dishItems.length;
      const drinkCount = drinkItems.length;
      const linePricing = getCartLinePricing();

      const dishTotal = dishItems.reduce((s, c) => s + c.price, 0);
      const drinkOriginalTotal = drinkItems.reduce((s, c) => s + c.price, 0);
      const drinkPayableTotal = linePricing
        .filter((_, i) => cart[i].type === "drink")
        .reduce((s, line) => s + line.payable, 0);
      const drinkDiscount = drinkOriginalTotal - drinkPayableTotal;
      const freeDrinkCount = Math.min(dishCount, drinkCount);
      const paidDrinkCount = Math.max(0, drinkCount - dishCount);

      return {
        dishCount,
        drinkCount,
        freeDrinkCount,
        paidDrinkCount,
        dishTotal,
        drinkOriginalTotal,
        drinkPayableTotal,
        drinkDiscount,
        total: dishTotal + drinkPayableTotal,
        linePricing
      };
    }

    // 渲染購物車
    function renderCart() {
      const el = document.getElementById("cartItems");
      const totals = calculateTotals();
      document.getElementById("subtotal").textContent = `$${totals.total}`;
      document.getElementById("cartCount").textContent = `${cart.length} 件`;
      el.innerHTML = cart.length
        ? cart.map((c, i) => `
          <div class="border rounded-lg p-2 text-sm">
            <div class="flex justify-between">
              <span>${c.name}</span>
              <div class="flex items-center gap-2">
                <span>${formatLinePrice(totals.linePricing[i])}</span>
                <button class="text-red-600" onclick="removeItem(${i})">移除</button>
              </div>
            </div>
            ${c.specialRequestOptions && c.specialRequestOptions.length
              ? `<div class="mt-1 text-xs text-slate-500">Special Request: ${c.specialRequestOptions.join(", ")}</div>`
              : ""}
          </div>
        `).join("")
        : '<p class="text-sm text-slate-400">尚未加入任何項目</p>';
    }

    function removeItem(index) {
      cart.splice(index, 1);
      renderCart();
    }

    // 訂單預覽
    const modal = document.getElementById("previewModal");
    document.getElementById("previewBtn").addEventListener("click", () => {
      const content = document.getElementById("previewContent");
      const totals = calculateTotals();
      content.innerHTML = cart.length
        ? `
          ${cart.map((c, i) => `
            <div class="flex justify-between text-sm">
              <span>${c.name}${totals.linePricing[i].isSingleDrink ? "（單點）" : ""}</span>
              <span>${formatLinePrice(totals.linePricing[i])}</span>
            </div>
            ${c.specialRequestOptions && c.specialRequestOptions.length
              ? `<div class="text-xs text-slate-500 -mt-1 mb-1">Special Request: ${c.specialRequestOptions.join(", ")}</div>`
              : ""}
          `).join("")}
          <div class="border-t mt-2 pt-2 text-sm flex justify-between">
            <span>Drink 原價小計</span>
            <span>$${totals.drinkOriginalTotal}</span>
          </div>
          <div class="text-sm flex justify-between">
            <span>Drink 搭配優惠（最多 ${totals.dishCount} 杯免費）</span>
            <span class="text-green-700">-${totals.drinkDiscount}</span>
          </div>
          ${totals.paidDrinkCount > 0
            ? `<div class="text-xs text-orange-600">有 ${totals.paidDrinkCount} 杯飲品超過 Dish 數量，按單點計價</div>`
            : ""}
        `
        : '<p class="text-sm text-slate-400">購物車是空的</p>';
      document.getElementById("previewTotal").textContent = `$${totals.total}`;
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    });
    document.getElementById("closeModal").addEventListener("click", () => {
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    });

    function closePreviewModal() {
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function submitOrder() {
      if (!assertOrderWindowOpen()) return;
      if (!cart.length) {
        alert("購物車是空的，請先加入菜品或飲品。");
        return;
      }
      const storeState = loadCanteenState();
      const stockCheck = validateOrderStock(storeState, cart);
      if (!stockCheck.ok) {
        alert(stockCheck.message);
        reloadPublishedMenu();
        return;
      }
      const totals = calculateTotals();
      const orderId = Date.now();
      const order = {
        id: orderId,
        role: frontendRole,
        createdAt: new Date().toISOString(),
        items: cart.map(c => ({ ...c })),
        total: totals.total
      };
      try {
        appendOrder(order);
      } catch (_) {
        /* 訂單紀錄寫入失敗不阻擋送出 */
      }
      deductStockForOrder(storeState, cart);
      cart.length = 0;
      reloadPublishedMenu();
      renderCart();
      closePreviewModal();
      renderMyOrders();
      alert(
        `訂單已送出！\n訂單編號：${orderId}\n總計：$${totals.total}\n菜品庫存已更新。\n感謝您的訂購，謝謝﹗`
      );
    }

    document.getElementById("submitOrderBtn").addEventListener("click", submitOrder);

    function refreshCustomerPage() {
      reloadPublishedMenu();
      renderMyOrders();
      const modal = document.getElementById("allOrdersModal");
      if (modal && !modal.classList.contains("hidden")) {
        openAllOrdersModal();
      }
    }

    reloadPublishedMenu();
    renderCart();
    renderMyOrders();

    window.addEventListener("canteen-store-updated", refreshCustomerPage);
    window.addEventListener("storage", (e) => {
      if (
        e.key === CANTEEN_STORE_KEY ||
        e.key === CANTEEN_IMAGE_STORE_KEY ||
        e.key === CANTEEN_ORDERS_KEY
      ) {
        refreshCustomerPage();
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        refreshCustomerPage();
      }
    });
  </script>
</body>
</html>
