# ============================================================
# 校園餐廳 POS 系統 — Nginx 設定檔
# ============================================================
# 角色：反向代理（交通警察）
# 對外只開放 Port 80 / 443，將請求依路徑分流至 5 個後端 Java 微服務。
#
# 部署方式：
#   - 有 Docker：使用官方 nginx image（已內置），掛載本檔案
#       docker run -d -p 80:80 -v $(pwd)/nginx.conf:/etc/nginx/nginx.conf:ro nginx
#   - 無 Docker：於 AWS EC2 直接安裝
#       sudo apt update && sudo apt install -y nginx
#       sudo nano /etc/nginx/nginx.conf      （貼入本檔內容）
#       sudo nginx -t                         （測試語法）
#       sudo systemctl restart nginx
# ============================================================

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # ----- 基本設定 -----
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 10M;          # 上傳檔案上限（菜單圖片用）

    # ----- 日誌格式 -----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log main;
    error_log   /var/log/nginx/error.log warn;

    # ----- Gzip 壓縮（加速前端載入）-----
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ============================================================
    # Upstream — 5 大後端微服務（內部位址，不對外暴露）
    # ============================================================
    upstream identity_service {
        server 127.0.0.1:8080;
        # server 127.0.0.1:8090 backup;   # 備援節點，主節點掛掉時啟用
    }
    upstream wallet_service {
        server 127.0.0.1:8081;
    }
    upstream menu_service {
        server 127.0.0.1:8082;
    }
    upstream checkout_service {
        server 127.0.0.1:8084;          # Cart + Order 合併
    }
    upstream pickup_service {
        server 127.0.0.1:8085;
    }

    # ============================================================
    # 主伺服器（對外 Port 80）
    # ============================================================
    server {
        listen      80;
        server_name  54.82.49.xxx;       # 替換為實際 EC2 公網 IP 或網域

        # ----- CORS 統一處理（前後端同域，自然無 CORS 問題）-----
        # 因為前端與所有 API 皆走 Nginx，瀏覽器視為同一個 origin

        # ----- 前端靜態檔（React build 後的 dist）-----
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;     # 支援 React Router
        }

        # ============================================================
        # API 路由分流 — 5 大微服務
        # ============================================================

        # ① Identity Service — 身分認證
        location /api/identity/ {
            proxy_pass         http://identity_service/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ② Wallet Service — 錢包金流
        location /api/wallet/ {
            proxy_pass         http://wallet_service/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ③ Menu Service — 菜單庫存
        location /api/menu/ {
            proxy_pass         http://menu_service/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ④ Checkout Service — 購物車 + 訂單
        location /api/checkout/ {
            proxy_pass         http://checkout_service/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ⑤ Pickup Service — 取餐核銷
        location /api/pickup/ {
            proxy_pass         http://pickup_service/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ----- 健康檢查（不寫日誌）-----
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # ----- 防止外人探測 -----
        location ~ /\. {
            deny all;
        }
    }
}
