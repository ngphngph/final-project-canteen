services:
  restaurant-app:
    build: ./restaurant-app
    environment:
      IMAGE_UPLOAD_DIR: /app/uploads/menu
      JAVA_TOOL_OPTIONS: -Xmx480m -Xms128m -XX:+UseContainerSupport
      # Set these in Zeabur environment variables:
      # SPRING_DATASOURCE_URL: jdbc:postgresql://...neon.tech/restaurant_db?sslmode=require
      # SPRING_DATASOURCE_USERNAME: ...
      # SPRING_DATASOURCE_PASSWORD: ...
      # STRIPE_SECRET_KEY: sk_live_...
      # JWT_SECRET: your-32-char-secret
      # SECURITY_ADMIN_PASSWORD: strongpassword
      # SECURITY_KITCHEN_PASSWORD: strongpassword
      # GEMINI_API_KEY: ...
    volumes:
      - uploads_data:/app/uploads/menu
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m

  nginx:
    image: nginx:1.29
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./restaurant-app/src/main/resources/static:/usr/share/nginx/html:ro
    depends_on:
      - restaurant-app
    restart: unless-stopped

volumes:
  uploads_data:
