<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>取餐狀況查詢</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-6 space-y-5">
    <div class="text-center">
      <div class="text-4xl mb-2">🍴</div>
      <h1 class="text-xl font-bold text-slate-800">取餐狀況查詢</h1>
      <p class="text-sm text-slate-500 mt-1">輸入取餐碼即可查詢進度</p>
    </div>

    <div class="flex gap-2">
      <input id="codeInput" type="text" placeholder="例：0289-018"
        class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400 uppercase tracking-widest" />
      <button onclick="query()"
        class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 transition-colors">
        查詢
      </button>
    </div>

    <div id="result" class="hidden rounded-xl p-4 text-center space-y-1"></div>

    <p class="text-center text-xs text-slate-400">
      <a href="/" class="hover:underline">← 返回點餐主頁</a>
    </p>
  </div>

  <script>
    const API = "/api/pickups/status";

    async function query() {
      const code = document.getElementById("codeInput").value.trim().toUpperCase();
      if (!code) return;
      const result = document.getElementById("result");
      result.className = "rounded-xl p-4 text-center space-y-1 bg-slate-100";
      result.innerHTML = '<p class="text-slate-500 text-sm">查詢中…</p>';
      result.classList.remove("hidden");
      try {
        const res = await fetch(`${API}?code=${encodeURIComponent(code)}`);
        const data = res.ok ? await res.json() : null;
        if (!data || data.status === "NOT_FOUND") {
          result.className = "rounded-xl p-4 text-center space-y-1 bg-red-50 border border-red-200";
          result.innerHTML = `
            <p class="text-2xl">❓</p>
            <p class="font-semibold text-red-700">找不到取餐碼</p>
            <p class="text-xs text-red-500">（${code}）請確認後再試</p>`;
        } else if (data.status === "READY") {
          result.className = "rounded-xl p-4 text-center space-y-1 bg-green-50 border border-green-200";
          result.innerHTML = `
            <p class="text-2xl">✅</p>
            <p class="font-semibold text-green-700">餐點已完成，可以取餐！</p>
            <p class="text-xs text-slate-500">取餐碼：<span class="font-mono font-bold text-slate-700">${data.code}</span></p>
            ${data.expectedTime ? `<p class="text-xs text-slate-500">預計時間：${data.expectedTime}</p>` : ""}`;
        } else {
          result.className = "rounded-xl p-4 text-center space-y-1 bg-amber-50 border border-amber-200";
          result.innerHTML = `
            <p class="text-2xl">👨‍🍳</p>
            <p class="font-semibold text-amber-700">餐點製作中，請稍候</p>
            <p class="text-xs text-slate-500">取餐碼：<span class="font-mono font-bold text-slate-700">${data.code}</span></p>
            ${data.expectedTime ? `<p class="text-xs text-slate-500">預計時間：${data.expectedTime}</p>` : ""}`;
        }
      } catch (_) {
        result.className = "rounded-xl p-4 text-center space-y-1 bg-red-50 border border-red-200";
        result.innerHTML = '<p class="text-red-600 text-sm">無法連線，請稍後再試。</p>';
      }
    }

    // Auto-query if ?code= is in the URL
    (function () {
      const code = new URLSearchParams(window.location.search).get("code");
      if (code) {
        document.getElementById("codeInput").value = code.toUpperCase();
        query();
      }
    })();

    // Allow Enter key to trigger query
    document.getElementById("codeInput").addEventListener("keydown", e => {
      if (e.key === "Enter") query();
    });
  </script>
</body>
</html>
