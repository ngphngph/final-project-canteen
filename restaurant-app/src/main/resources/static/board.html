<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>取餐等候板 — Canteen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Arial', 'Microsoft JhengHei', sans-serif;
      background: #080D18;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    .board-header {
      background: #111827;
      border-bottom: 3px solid #F59E0B;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .board-brand { font-size: 26px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; color: #F59E0B; }
    .board-subtitle { font-size: 11px; letter-spacing: 3px; color: #6B7280; text-transform: uppercase; margin-top: 3px; }
    .board-clock { text-align: right; }
    .board-time { font-size: 36px; font-weight: 300; font-variant-numeric: tabular-nums; color: #F3F4F6; letter-spacing: 2px; }
    .board-date { font-size: 12px; color: #6B7280; letter-spacing: 1px; margin-top: 3px; }

    /* ── MAIN BOARD ── */
    .board-main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      background: #1F2937;
      min-height: 0;
    }

    /* ── COLUMNS ── */
    .board-col { background: #080D18; display: flex; flex-direction: column; overflow: hidden; }
    .board-col-header { padding: 22px 28px 18px; text-align: center; flex-shrink: 0; }
    .col-preparing .board-col-header { background: #150F00; border-bottom: 4px solid #F59E0B; }
    .col-ready     .board-col-header { background: #071510; border-bottom: 4px solid #10B981; }

    .col-label { font-size: 22px; font-weight: 800; letter-spacing: 5px; text-transform: uppercase; }
    .col-preparing .col-label { color: #F59E0B; }
    .col-ready     .col-label { color: #10B981; }
    .col-sublabel { font-size: 11px; letter-spacing: 3px; margin-top: 5px; opacity: 0.5; text-transform: uppercase; }

    .board-col-body {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-content: flex-start;
      overflow-y: auto;
    }

    /* ── ORDER TILES ── */
    .order-tile {
      border-radius: 8px;
      padding: 18px 24px;
      min-width: 152px;
      text-align: center;
    }
    .col-preparing .order-tile {
      background: #1C1300;
      border: 2px solid #F59E0B55;
    }
    .col-ready .order-tile {
      background: #071510;
      border: 2px solid #10B98177;
      animation: pulse-ready 2.5s ease-in-out infinite;
    }
    @keyframes pulse-ready {
      0%, 100% { border-color: #10B98155; box-shadow: none; }
      50%       { border-color: #10B981CC; box-shadow: 0 0 18px #10B98133; }
    }

    .order-tile-code {
      font-family: 'Courier New', 'Consolas', monospace;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 3px;
    }
    .col-preparing .order-tile-code { color: #FCD34D; }
    .col-ready     .order-tile-code { color: #6EE7B7; }

    .order-tile-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.45;
      margin-top: 6px;
    }

    .board-empty {
      color: #1F2937;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      padding: 60px 0;
      width: 100%;
    }

    /* ── FOOTER ── */
    .board-footer {
      background: #111827;
      border-top: 1px solid #1F2937;
      padding: 11px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .board-footer-text { font-size: 12px; color: #374151; letter-spacing: 1px; }
    .board-status { font-size: 11px; color: #10B981; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
    .blink-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #10B981;
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
  </style>
</head>
<body>

<header class="board-header">
  <div>
    <div class="board-brand">Canteen</div>
    <div class="board-subtitle">Order Waiting Board &nbsp;·&nbsp; 取餐等候板</div>
  </div>
  <div class="board-clock">
    <div id="boardTime" class="board-time"></div>
    <div id="boardDate" class="board-date"></div>
  </div>
</header>

<div class="board-main">

  <div class="board-col col-preparing">
    <div class="board-col-header">
      <div class="col-label">備餐中</div>
      <div class="col-sublabel">Preparing</div>
    </div>
    <div id="preparingBody" class="board-col-body">
      <p class="board-empty">暫無訂單</p>
    </div>
  </div>

  <div class="board-col col-ready">
    <div class="board-col-header">
      <div class="col-label">請取餐</div>
      <div class="col-sublabel">Ready to Collect</div>
    </div>
    <div id="readyBody" class="board-col-body">
      <p class="board-empty">暫無訂單</p>
    </div>
  </div>

</div>

<footer class="board-footer">
  <span class="board-footer-text">如有疑問，請向飯堂職員查詢 &nbsp;·&nbsp; <a href="/" style="color:#4B5563;text-decoration:none;">← 返回點餐</a></span>
  <span class="board-status"><span class="blink-dot"></span>每 20 秒自動更新</span>
</footer>

<script>
  function pickupCode(order) {
    const ph = order.phone ? String(order.phone).slice(-4) : String(order.userId % 10000).padStart(4, '0');
    const od = String(order.orderId % 1000).padStart(3, '0');
    return ph + '-' + od;
  }

  function updateClock() {
    const now = new Date();
    document.getElementById('boardTime').textContent =
      now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    document.getElementById('boardDate').textContent =
      now.toLocaleDateString('zh-HK', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  }

  let _lastJson = '';

  function renderTiles(containerId, orders) {
    const el = document.getElementById(containerId);
    if (!orders.length) {
      el.innerHTML = '<p class="board-empty">暫無訂單</p>';
      return;
    }
    el.innerHTML = orders.map(o =>
      '<div class="order-tile">' +
        '<div class="order-tile-code">' + pickupCode(o) + '</div>' +
        '<div class="order-tile-label">取餐碼</div>' +
      '</div>'
    ).join('');
  }

  async function refresh() {
    try {
      const res = await fetch('/orders/today');
      if (!res.ok) return;
      const orders = await res.json();
      const json = JSON.stringify(orders);
      if (json === _lastJson) return;
      _lastJson = json;
      renderTiles('preparingBody', orders.filter(o => o.orderStatus === 'DEPOSIT_PAID' || o.orderStatus === 'FULLY_PAID'));
      renderTiles('readyBody',     orders.filter(o => o.orderStatus === 'COMPLETE'));
    } catch (_) {}
  }

  updateClock();
  setInterval(updateClock, 1000);
  refresh();
  setInterval(refresh, 20000);
</script>
</body>
</html>
