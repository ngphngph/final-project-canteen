<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園服務系統 - 登入</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); max-width: 420px; width: 90%; text-align: center; }
        h2 { color: #343a40; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; color: white; font-weight: bold; background-color: #28a745; margin-top: 10px; }
        .link { margin-top: 15px; display: block; font-size: 14px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>系統登入</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="role">選擇角色</label>
            <select id="role" required>
                <option value="">請選擇</option>
                <option value="STUDENT">學生 Student</option>
                <option value="TEACHER">教師 Teacher</option>
                <option value="ADMIN">管理員 Admin</option>
                <option value="KITCHEN">廚房 Kitchen</option>
            </select>
        </div>
        <div class="form-group">
            <label for="phone">電話號碼</label>
            <input type="text" id="phone" maxlength="8" required placeholder="8 位數字電話號碼">
        </div>
        <div class="form-group">
            <label for="password">密碼</label>
            <input type="password" id="password" maxlength="8" required placeholder="8 位數字密碼">
        </div>
        <button type="submit">登入</button>
    </form>
    <p id="loginMsg" style="display:none; margin-top:14px; padding:10px 14px; border-radius:6px; font-size:14px;"></p>
    <a href="index.html" class="link">註冊新帳號</a>
    <a href="change-password.html" class="link">忘記 / 更改密碼</a>
</div>
<script>
    function showMessage(text, color) {
        const el = document.getElementById('loginMsg');
        el.textContent = text;
        el.style.display = 'block';
        el.style.background = color === 'green' ? '#d4edda' : '#f8d7da';
        el.style.color      = color === 'green' ? '#155724' : '#721c24';
        el.style.border     = '1px solid ' + (color === 'green' ? '#c3e6cb' : '#f5c6cb');
    }
    const isEightDigits = value => /^\d{8}$/.test(value);

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const role = document.getElementById('role').value;
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!role) return alert('請選擇角色');
        if (!isEightDigits(phone)) return alert('電話號碼必須為 8 位數字');
        if (!isEightDigits(password)) return alert('密碼必須為 8 位數字');

        const btn = document.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = '登入中…';

        fetch('/api/users/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role, phone, password })
        })
        .then(async res => {
            const rawText = await res.text();
            let data;
            try { data = JSON.parse(rawText); } catch (_) { data = { message: rawText }; }

            if (res.ok) {
                showMessage('✅ ' + (data.message || '登入成功'), 'green');
                setTimeout(() => { window.location.href = 'index.html'; }, 1500);
            } else {
                showMessage('❌ ' + (data.message || '登入失敗'), 'red');
                btn.disabled = false;
                btn.textContent = '登入';
            }
        })
        .catch(() => {
            showMessage('❌ 系統連線錯誤，請確認伺服器是否開啟。', 'red');
            btn.disabled = false;
            btn.textContent = '登入';
        });
    });
</script>
</body>
</html>
