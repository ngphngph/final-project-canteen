<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>教師註冊</title>
    <style>
        body { font-family: sans-serif; background-color: #fff0f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 320px; text-align: center; border-top: 5px solid #d63384; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #d63384; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        a { display: block; margin-top: 12px; color: #d63384; }
        #msg { display: none; margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 14px; text-align: left; }
        .ok  { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
<div class="container">
    <h2>教師註冊</h2>
    <form id="regForm">
        <input type="text"     id="phone"      maxlength="8" required placeholder="電話號碼：8 位數字">
        <input type="password" id="password"   maxlength="8" required placeholder="密碼：8 位數字">
        <input type="text"     id="employeeId" maxlength="9" required placeholder="教師編號：t12345678">
        <button type="submit" id="submitBtn">註冊教師帳號</button>
    </form>
    <p id="msg"></p>
    <a href="index.html">返回</a>
</div>
<script>
    function showMsg(text, ok) {
        const el = document.getElementById('msg');
        el.textContent = text;
        el.className = ok ? 'ok' : 'err';
        el.style.display = 'block';
    }

    document.getElementById('regForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const phone      = document.getElementById('phone').value.trim();
        const password   = document.getElementById('password').value.trim();
        const employeeId = document.getElementById('employeeId').value.trim();
        const btn        = document.getElementById('submitBtn');

        if (!/^\d{8}$/.test(phone))      return showMsg('電話號碼必須為 8 位數字', false);
        if (!/^\d{8}$/.test(password))   return showMsg('密碼必須為 8 位數字', false);
        if (!/^t\d{8}$/.test(employeeId)) return showMsg('教師編號格式必須為 t12345678', false);

        btn.disabled = true;
        btn.textContent = '處理中…';

        try {
            const res = await fetch('/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, password, role: 'TEACHER', specificId: employeeId })
            });
            const rawText = await res.text();
            let message;
            try {
                const data = JSON.parse(rawText);
                message = typeof data === 'string' ? data : (data.message || rawText);
            } catch (_) {
                message = rawText;
            }
            showMsg(message, res.ok);
            if (res.ok) setTimeout(() => { location.href = 'login.html'; }, 1800);
        } catch (_) {
            showMsg('系統連線錯誤，請確認伺服器是否開啟。', false);
        } finally {
            btn.disabled = false;
            btn.textContent = '註冊教師帳號';
        }
    });
</script>
</body>
</html>
