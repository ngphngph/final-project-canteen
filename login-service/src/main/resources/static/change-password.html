<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更改密碼</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background:#f4f7f6; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
        .container { background:white; padding:35px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,.1); max-width:420px; width:90%; }
        h2 { text-align:center; }
        label { display:block; margin:12px 0 5px; font-weight:bold; }
        input, select, button { width:100%; padding:12px; box-sizing:border-box; border-radius:6px; border:1px solid #ccc; }
        button { margin-top:18px; background:#0d6efd; color:white; border:none; font-weight:bold; cursor:pointer; }
        .hint { font-size:13px; color:#666; margin-top:8px; line-height:1.5; }
        a { display:block; margin-top:15px; text-align:center; color:#0d6efd; }
    </style>
</head>
<body>
<div class="container">
    <h2>更改密碼</h2>
    <form id="changeForm">
        <label for="role">角色</label>
        <select id="role" required>
            <option value="">請選擇</option>
            <option value="STUDENT">學生 Student</option>
            <option value="TEACHER">教師 Teacher</option>
            <option value="ADMIN">管理員 Admin</option>
            <option value="KITCHEN">廚房 Kitchen</option>
        </select>

        <label for="identifier">識別資料</label>
        <input type="text" id="identifier" required placeholder="先選角色">
        <div class="hint" id="hint">學生用 s12345678；教師用 t12345678；Admin 用 a 開頭編號；Kitchen 用 8 位電話號碼。</div>

        <label for="newPassword">新密碼</label>
        <input type="password" id="newPassword" maxlength="8" required placeholder="8 位數字新密碼">
        <button type="submit">更新密碼</button>
    </form>
    <a href="login.html">返回登入</a>
</div>
<script>
    const roleInput = document.getElementById('role');
    const identifierInput = document.getElementById('identifier');
    const hints = {
        STUDENT: '請輸入學生編號，例如：s12345678',
        TEACHER: '請輸入教師編號，例如：t12345678',
        ADMIN: '請輸入 Admin 編號，例如：a12345678',
        KITCHEN: '請輸入 Kitchen 電話號碼，例如：12345678'
    };
    roleInput.addEventListener('change', () => {
        identifierInput.value = '';
        identifierInput.placeholder = hints[roleInput.value] || '先選角色';
        document.getElementById('hint').textContent = hints[roleInput.value] || '學生用 s12345678；教師用 t12345678；Admin 用 a 開頭編號；Kitchen 用 8 位電話號碼。';
    });

    document.getElementById('changeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const role = roleInput.value;
        const identifier = identifierInput.value.trim();
        const newPassword = document.getElementById('newPassword').value.trim();
        if (!role) return alert('請選擇角色');
        if (!/^\d{8}$/.test(newPassword)) return alert('新密碼必須為 8 位數字');
        if (role === 'STUDENT' && !/^s\d{8}$/.test(identifier)) return alert('學生必須用 s12345678 格式');
        if (role === 'TEACHER' && !/^t\d{8}$/.test(identifier)) return alert('教師必須用 t12345678 格式');
        if (role === 'ADMIN' && !/^a\d{8}$/.test(identifier)) return alert('Admin 必須用 a 開頭加 8 位數字');
        if (role === 'KITCHEN' && !/^\d{8}$/.test(identifier)) return alert('Kitchen 必須用 8 位電話號碼');

        fetch('/api/users/change-password', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role, identifier, newPassword })
        }).then(res => res.text()).then(msg => { alert(msg); if (msg.includes('成功')) location.href='login.html'; });
    });
</script>
</body>
</html>
