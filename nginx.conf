server {
    listen      80;
    server_name _;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /api/login/ {
        proxy_pass http://login-service.zeabur.internal:8081/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/menu/ {
        proxy_pass http://menu-service.zeabur.internal:8080/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/order/ {
        proxy_pass http://order-service.zeabur.internal:8084/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/wallet/ {
        proxy_pass http://wallet-service.zeabur.internal:8082/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/pickup/ {
        proxy_pass http://pickup-service.zeabur.internal:8085/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
